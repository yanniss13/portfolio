<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Variante du monogramme optimisée pour les très petites tailles :
       fond plein et traits épaissis, car le contour fin de la version
       du site devient illisible en dessous de 32px. -->
