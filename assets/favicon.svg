    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00dbe9" />
      <stop offset="1" stop-color="#dcb8ff" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#0b1326" />
  <g fill="none" stroke="url(#f)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 14 L17 23 L17 34 M24 14 L17 23" />
    <path d="M28 14 L28 34 M28 14 L34.5 14 L37.5 17 L37.5 20 L34.5 23 L28 23 M28 23 L35.5 23 L38.5 26 L38.5 31 L35.5 34 L28 34" />
  </g>
</svg>
